name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK inside project
      run: |
        cd edimax-app/platforms/android
        chmod +x gradlew || echo "No gradlew found yet"

    - name: Build Android Package via Gradle
      run: |
        cd edimax-app/platforms/android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: edimax-app/platforms/android/app/build/outputs/apk/debug/*.apk
